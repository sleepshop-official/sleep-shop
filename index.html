<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>線上目錄與喊單系統</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #f8f9fa; margin: 0; padding: 15px; color: #333; }
    .header { text-align: center; margin-bottom: 20px; }
    .header h1 { margin: 10px 0 5px; font-size: 22px; }
    
    .category-bar { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 10px; margin-bottom: 15px; }
    .category-btn { background: #e9ecef; border: none; padding: 6px 14px; border-radius: 20px; cursor: pointer; white-space: nowrap; font-size: 14px; }
    .category-btn.active { background: #4a90e2; color: white; }

    .product-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 15px; margin-bottom: 30px; }
    .product-card { background: white; border-radius: 12px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.06); display: flex; flex-direction: column; }
    
    /* 多圖展示區 */
    .img-container { position: relative; width: 100%; height: 160px; background: #eee; }
    .product-img { width: 100%; height: 100%; object-fit: cover; cursor: pointer; }
    .thumbs-bar { display: flex; gap: 4px; padding: 6px; overflow-x: auto; background: #fff; border-bottom: 1px solid #eee; }
    .thumb-img { width: 32px; height: 32px; object-fit: cover; border-radius: 4px; cursor: pointer; border: 1px solid #ddd; }
    .thumb-img.active { border-color: #4a90e2; border-width: 2px; }

    .product-info { padding: 12px; display: flex; flex-direction: column; flex-grow: 1; }
    .product-title { font-weight: bold; font-size: 15px; margin-bottom: 4px; }
    .product-price { color: #e63946; font-weight: bold; font-size: 16px; margin-bottom: 8px; }
    
    .option-select { width: 100%; padding: 6px; margin-bottom: 6px; border: 1px solid #ddd; border-radius: 6px; font-size: 13px; }
    .add-btn { background: #4a90e2; color: white; border: none; padding: 8px; border-radius: 6px; font-weight: bold; cursor: pointer; width: 100%; margin-top: auto; }
    
    .cart-section { max-width: 500px; margin: 0 auto; }
    .order-card { background: white; padding: 20px; border-radius: 12px; border: 2px dashed #4a90e2; }
    .order-header { text-align: center; border-bottom: 1px solid #eee; padding-bottom: 10px; margin-bottom: 15px; }
    .order-item { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; font-size: 14px; }
    .qty-controls { display: flex; align-items: center; gap: 8px; }
    .qty-btn { border: 1px solid #ccc; background: #f0f0f0; border-radius: 4px; width: 24px; height: 24px; cursor: pointer; }
    .order-total { font-size: 18px; font-weight: bold; text-align: right; color: #e63946; border-top: 1px solid #eee; margin-top: 15px; padding-top: 10px; }
    .screenshot-btn { background: #2ec4b6; color: white; border: none; padding: 14px; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; width: 100%; margin-top: 15px; }

    /* 大圖彈窗 */
    .modal { display: none; position: fixed; z-index: 1000; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); justify-content: center; align-items: center; }
    .modal img { max-width: 90%; max-height: 80%; border-radius: 8px; }
  </style>
</head>
<body>

  <div class="header">
    <h1>🛍️ 團務喊單目錄</h1>
    <p>點擊圖片可放大，選擇規格後生成訂單截圖傳給我！</p>
  </div>

  <div id="category-bar" class="category-bar"></div>
  <div id="product-list" class="product-list">
    <p style="text-align:center; grid-column: 1/-1;">商品載入中...</p>
  </div>

  <div class="cart-section">
    <div id="order-card" class="order-card">
      <div class="order-header">
        <h3 style="margin:0;">📝 我的選購清單</h3>
        <span id="order-time" style="font-size: 12px; color: #888;"></span>
      </div>
      <div id="cart-list">
        <p style="text-align: center; color: #aaa; margin: 20px 0;">還沒有選擇商品喔！</p>
      </div>
      <div class="order-total">
        總金額：$<span id="total-price">0</span>
      </div>
    </div>
    <button class="screenshot-btn" onclick="takeScreenshot()">📸 下載訂單截圖（傳給賣家）</button>
  </div>

  <!-- 放大檢視圖片視窗 -->
  <div id="img-modal" class="modal" onclick="this.style.display='none'">
    <img id="modal-img" src="">
  </div>

  <script>
    // ⚠️ 請把引號裡替換成你 Google 試算表發布的 CSV 網址 ⚠️
    const SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQeVbV5Fh_iuHnmEQdeDfD07H_VX0F-_siv4p4hivU_r2bTH8Q9ZA4SHP8jWAe7vcBLZKlQBIn2u27u/pubhtml";

    let allProducts = [];
    let cart = {};

    Papa.parse(SHEET_CSV_URL, {
      download: true,
      header: true,
      complete: function(results) {
        allProducts = results.data.filter(p => p.name && p.price);
        setupCategories();
        renderProducts('全部');
      }
    });

    function setupCategories() {
      const categories = ['全部', ...new Set(allProducts.map(p => p.category).filter(Boolean))];
      const bar = document.getElementById('category-bar');
      bar.innerHTML = '';
      categories.forEach(cat => {
        const btn = document.createElement('button');
        btn.className = `category-btn ${cat === '全部' ? 'active' : ''}`;
        btn.innerText = cat;
        btn.onclick = () => {
          document.querySelectorAll('.category-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          renderProducts(cat);
        };
        bar.appendChild(btn);
      });
    }

    function renderProducts(filterCategory) {
      const container = document.getElementById('product-list');
      container.innerHTML = '';

      const filtered = filterCategory === '全部' 
        ? allProducts 
        : allProducts.filter(p => p.category === filterCategory);

      filtered.forEach((item, index) => {
        const priceNum = Number(item.price);
        const sizes = item.size ? item.size.split('/') : [];
        const colors = item.color ? item.color.split('/') : [];
        
        // 拆解多張圖片網址（用逗號隔開）
        const images = item.image ? item.image.split(',').map(s => s.trim()) : ['https://via.placeholder.com/150'];

        let thumbsHtml = '';
        if (images.length > 1) {
          thumbsHtml = `<div class="thumbs-bar">` + 
            images.map((img, imgIdx) => `<img src="${img}" class="thumb-img ${imgIdx===0?'active':''}" onclick="switchImg(${index}, '${img}', this)">`).join('') + 
            `</div>`;
        }

        let sizeHtml = sizes.length ? `<select class="option-select" id="size-${index}">` + sizes.map(s => `<option value="${s.trim()}">${s.trim()}</option>`).join('') + `</select>` : '';
        let colorHtml = colors.length ? `<select class="option-select" id="color-${index}">` + colors.map(c => `<option value="${c.trim()}">${c.trim()}</option>`).join('') + `</select>` : '';

        const card = document.createElement('div');
        card.className = 'product-card';
        card.innerHTML = `
          <div class="img-container">
            <img src="${images[0]}" class="product-img" id="main-img-${index}" onclick="openModal('${images[0]}')">
          </div>
          ${thumbsHtml}
          <div class="product-info">
            <div class="product-title">${item.name}</div>
            <div class="product-price">$${priceNum}</div>
            ${sizeHtml}
            ${colorHtml}
            <button class="add-btn" onclick="addToCartWithSpec(${index})">+ 加入清單</button>
          </div>
        `;
        container.appendChild(card);
      });
    }

    function switchImg(cardIdx, imgUrl, el) {
      const mainImg = document.getElementById(`main-img-${cardIdx}`);
      mainImg.src = imgUrl;
      mainImg.onclick = () => openModal(imgUrl);
      
      const thumbs = el.parentElement.querySelectorAll('.thumb-img');
      thumbs.forEach(t => t.classList.remove('active'));
      el.classList.add('active');
    }

    function openModal(imgUrl) {
      document.getElementById('modal-img').src = imgUrl;
      document.getElementById('img-modal').style.display = 'flex';
    }

    function addToCartWithSpec(index) {
      const item = allProducts[index];
      const sizeEl = document.getElementById(`size-${index}`);
      const colorEl = document.getElementById(`color-${index}`);
      
      const selectedSize = sizeEl ? sizeEl.value : '';
      const selectedColor = colorEl ? colorEl.value : '';
      
      let specText = [selectedColor, selectedSize].filter(Boolean).join(' / ');
      let itemKey = specText ? `${item.name} (${specText})` : item.name;

      if (cart[itemKey]) {
        cart[itemKey].qty += 1;
      } else {
        cart[itemKey] = { price: Number(item.price), qty: 1 };
      }
      renderCart();
    }

    function updateQty(key, change) {
      if (cart[key]) {
        cart[key].qty += change;
        if (cart[key].qty <= 0) delete cart[key];
      }
      renderCart();
    }

    function renderCart() {
      const cartList = document.getElementById('cart-list');
      const totalPriceEl = document.getElementById('total-price');
      const timeEl = document.getElementById('order-time');
      
      timeEl.innerText = "下單時間：" + new Date().toLocaleString('zh-TW', { hour12: false });
      cartList.innerHTML = '';
      
      let total = 0;
      const keys = Object.keys(cart);

      if (keys.length === 0) {
        cartList.innerHTML = '<p style="text-align: center; color: #aaa; margin: 20px 0;">還沒有選擇商品喔！</p>';
        totalPriceEl.innerText = '0';
        return;
      }

      keys.forEach(key => {
        const item = cart[key];
        total += item.price * item.qty;

        const row = document.createElement('div');
        row.className = 'order-item';
        row.innerHTML = `
          <div>
            <strong>${key}</strong><br>
            <span style="color:#888; font-size:12px;">$${item.price} x ${item.qty}</span>
          </div>
          <div class="qty-controls">
            <button class="qty-btn" onclick="updateQty('${key}', -1)">-</button>
            <span>${item.qty}</span>
            <button class="qty-btn" onclick="updateQty('${key}', 1)">+</button>
          </div>
        `;
        cartList.appendChild(row);
      });

      totalPriceEl.innerText = total;
    }

    function takeScreenshot() {
      if (Object.keys(cart).length === 0) {
        alert('請先加入商品再點擊下載截圖喔！');
        return;
      }
      const element = document.getElementById('order-card');
      html2canvas(element).then(canvas => {
        const link = document.createElement('a');
        link.download = '我的購物明細.png';
        link.href = canvas.toDataURL('image/png');
        link.click();
      });
    }
  </script>
</body>
</html>
